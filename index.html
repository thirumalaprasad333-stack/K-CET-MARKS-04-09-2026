function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function showResult() {
 const mobile=document.getElementById('mobile').value.replace(/\D/g,'');
 const found=students.filter(s=>s.mobile===mobile);
 const result=document.getElementById('result'), error=document.getElementById('error');
 if(!found.length){result.style.display='none';error.style.display='block';return;}
 error.style.display='none';
 let output='';
 found.forEach(s=>{
   let rows=Object.entries(s.subjects).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td><td>60</td></tr>`).join('');
   output+=`<div class="card" style="margin-bottom:25px">
   <div class="cardHead"><h2>${esc(s.exam)}</h2><div>K-CET Results Score Card</div></div>
   <div class="details">
   <div class="grid">
   <div class="item"><b>STUDENT NAME</b>${esc(s.name)}</div>
   <div class="item"><b>MOBILE NUMBER</b>${esc(s.mobile)}</div>
   <div class="item"><b>ROLL / ID NUMBER</b>${esc(s.roll)}</div>
   <div class="item"><b>SECTION</b>${esc(s.section)}</div>
   </div>
   <table><tr><th>SUBJECT</th><th>MARKS</th><th>MAX MARKS</th></tr>${rows}</table>
   <div class="summary">
   <div class="box"><b>TOTAL</b><br>${esc(s.total)} / 180</div>
   <div class="box"><b>TEST RANK</b><br>${esc(s.rank)}</div>
   ${s.percentage!=='' ? `<div class="box"><b>PERCENTAGE</b><br>${esc(s.percentage)}%</div>` : ''}
   </div></div></div>`;
 });
 result.innerHTML=output; result.style.display='block';
}
document.getElementById('mobile').addEventListener('keypress',e=>{if(e.key==='Enter')showResult()});
